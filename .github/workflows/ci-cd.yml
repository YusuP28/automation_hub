name: Automation Hub CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'mobile/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'mobile/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  backend:
    name: Backend API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        working-directory: backend/automation_backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: API smoke test
        working-directory: backend/automation_backend
        run: |
          python -c "
          from main import app
          from fastapi.testclient import TestClient

          client = TestClient(app)
          response = client.get('/')
          assert response.status_code == 200
          assert 'Automation Hub API' in response.json()['message']

          health = client.get('/health')
          assert health.status_code == 200

          created = client.post('/tasks', json={
              'name': 'CI Task',
              'type': 'backup',
              'schedule': 'immediate',
              'parameters': {'source': '/data'}
          })
          assert created.status_code == 200
          assert created.json()['success'] is True

          print('API smoke test passed')
          "

  mobile:
    name: Mobile App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile/automation_mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile/automation_mobile
        run: flutter analyze

      - name: Run tests
        working-directory: mobile/automation_mobile
        run: flutter test

      - name: Build APK (split per ABI)
        working-directory: mobile/automation_mobile
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: automation-mobile-apk
          path: mobile/automation_mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
